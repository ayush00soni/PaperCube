name: Build and Publish Wheels

# This action runs every time a new Release is published on GitHub
on:
  release:
    types:
      - published

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Spin up three separate servers simultaneously
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build wheels using cibuildwheel
        uses: pypa/cibuildwheel@v2.17.0
        env:
          # Skip end-of-life Python versions (since you require 3.8+)
          CIBW_SKIP: "cp36-* cp37-*" 

      - name: Save the compiled wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  publish_to_pypi:
    name: Publish compiled wheels to PyPI
    needs: [build_wheels] # Wait for all OS builds to finish
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all compiled wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}